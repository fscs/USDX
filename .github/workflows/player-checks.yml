name: Player and queue checks

on: [push, pull_request]

jobs:
  players:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-fcl fp-units-net
      - name: Check player layouts and queue transport
        run: python3 test/check_players.py
